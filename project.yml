# XcodeGen spec for Cluecose (CGM companion for the FreeStyle Libre sensor).
# Regenerate with:  tools/xcodegen/bin/xcodegen generate
name: Cluecose
options:
  bundleIdPrefix: com.dsikic
  deployment:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  generateEmptySchemes: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    WATCHOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: Q53D65KB4X
    CODE_SIGN_STYLE: Automatic
packages:
  # Clean-room Libre 3 pairing + BLE + whitebox auth + data-plane decode.
  # MIT. Fork of the abandoned airedev326/LibreCRKit (DiaBLE's original pin).
  # Bundles phone certs + all Abbott runtime tables as resources and derives
  # the Phase-5 key on-device.
  LibreCRKit:
    url: https://github.com/pov-it/LibreCRKit
    branch: trio
  # Shared pure-Swift domain + analytics (no HealthKit/BLE/UI), used by both
  # the iPhone app and the Apple Watch app so the numbers match exactly.
  CluecoseCore:
    path: CluecoseCore
targets:
  Cluecose:
    type: application
    platform: iOS
    sources:
      - source/Cluecose
    dependencies:
      - package: LibreCRKit
        product: LibreCRKit
      - package: CluecoseCore
        product: CluecoseCore
      - target: CluecoseWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsikic.cluecose
        PRODUCT_NAME: Cluecose
        CODE_SIGN_ENTITLEMENTS: source/Cluecose/Cluecose.entitlements
        INFOPLIST_FILE: source/Cluecose/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  # Apple Watch companion. Xcode 27 deprecates the separate WatchKit extension:
  # a single-target watchOS app is a plain application target on watchOS
  # (product type application.watchapp2 would make Xcode treat it as a legacy
  # container and lipo a WK stub over the real binary → duplicate outputs).
  # It carries the UI (@main App), its own Info.plist and entitlements, and
  # reads glucose from HealthKit (written by the iPhone app).
  CluecoseWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - source/CluecoseWatch
      - source/CluecoseWatchExtension
    dependencies:
      - package: CluecoseCore
        product: CluecoseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsikic.cluecose.watch
        PRODUCT_NAME: CluecoseWatch
        CODE_SIGN_ENTITLEMENTS: source/CluecoseWatchExtension/CluecoseWatchExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: source/CluecoseWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  Cluecose:
    build:
      targets:
        Cluecose: all
    run:
      config: Debug
  CluecoseWatch:
    build:
      targets:
        CluecoseWatch: all
    run:
      config: Debug
